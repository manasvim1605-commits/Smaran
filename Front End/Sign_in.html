<!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-box">

        <h1>Welcome</h1>

        <h2>Please select an option</h2>

        <label class="role-option">
            <input type="radio" name="role" value="caregiver">
            <span>Sign In as Caregiver</span>
        </label>

        <label class="role-option">
            <input type="radio" name="role" value="player">
            <span>Sign In as Player</span>
        </label>

        <button onclick="continueLogin()">Continue</button>

    </div>

    <script src="nav.js"></script>

</body>
</html>
